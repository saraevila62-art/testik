name: Запуск тестов (без КТ2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Получить репозиторий
      uses: actions/checkout@v4

    - name: Установить Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Запустить все тесты (кроме КТ2)
      run: |
        echo "🔍 Запуск тестов из папки Tests (КТ2 исключён)..."
        shopt -s nullglob
        files=(Tests/test*.js)

        if [ ${#files[@]} -eq 0 ]; then
          echo "⚠️ Тестовые файлы не найдены."
          exit 0
        fi

        FAILED=0
        for file in "${files[@]}"; do
          if echo "$file" | grep -qi "KT2"; then
            echo "⏭️  Пропущен: $file"
            continue
          fi

          echo "🚀 Запуск: $file"
          if node "$file"; then
            echo "✅ Успешно: $file"
          else
            echo "❌ Провален: $file"
            FAILED=1
          fi
          echo "---"
        done

        if [ $FAILED -eq 1 ]; then
          echo "💥 Некоторые тесты провалились!"
          exit 1
        else
          echo "🎉 Все тесты пройдены!"
        fi
